name: Tests
on: [push, pull_request]

jobs:
  bash-unit-tests:
    name: Bash unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        # The runner starts steps with SIGPIPE ignored. A printf piped into a grep -q that stops at
        # an early match then gets EPIPE and prints "write error: Broken pipe" instead of dying
        # quietly as it does in a terminal. Each test gets the default SIGPIPE back.
        # A passing test is folded into a group titled with its result line. A failing one is printed
        # unfolded, and gets an annotation listing its failed checks on the run's summary page.
        run: |
          status=0
          failed=""
          for test in tests/test_*.sh; do
            rc=0
            out=$(env --default-signal=PIPE bash "${test}" 2>&1) || rc=$?
            if [ "${rc}" -eq 0 ]; then
              echo "::group::ok    ${test}: $(printf '%s\n' "${out}" | tail -n 1)"
              printf '%s\n' "${out}"
              echo "::endgroup::"
              continue
            fi
            status=1
            failed="${failed} ${test}"
            echo "FAIL  ${test}, exit ${rc}"
            printf '%s\n' "${out}"
            checks=$(printf '%s\n' "${out}" | sed -n 's/^ *FAIL //p')
            [ -z "${checks}" ] && checks="exit ${rc} without a FAIL line, see the log"
            checks=${checks//'%'/'%25'}
            checks=${checks//$'\n'/'%0A'}
            echo "::error file=${test},title=${test} failed::${checks}"
          done
          if [ -n "${failed}" ]; then
            echo
            echo "Failed:${failed}"
          fi
          exit "${status}"

  kickstart-up-to-date:
    name: Kickstart matches the scripts it embeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pre-commit hook keeps this in step locally, but a hook can be skipped with --no-verify
      # or simply never installed, so the guarantee has to be enforced here as well
      - name: Check ks.el9-10.cfg is regenerated
        run: bash kickstart_source_script/generate_kickstart.sh --check
